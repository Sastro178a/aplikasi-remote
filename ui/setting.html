<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.S.T.R.O - Setup Konfigurasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            color: #f8fafc; 
            overflow-x: hidden;
            background-color: #020617;
        }
        
        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        /* Animated Gradient Background */
        .bg-animated {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #064e3b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Panel */
        .glass-panel { 
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); 
        }

        /* Input Animations */
        input, select { transition: all 0.3s ease; }
        input:focus, select:focus { 
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4); 
            transform: translateY(-2px);
        }

        /* Button Glow */
        .btn-glow {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
            transform: scale(1.02);
        }

        /* Float Animation for Logo */
        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 
            0% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(34,211,238,0.5)); } 
            50% { transform: translateY(-10px); filter: drop-shadow(0 0 25px rgba(34,211,238,0.8)); } 
            100% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(34,211,238,0.5)); } 
        }

        /* Entrance Animations */
        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; transform: translateY(30px); }
        .delay-1 { animation-delay: 0.2s; } 
        .delay-2 { animation-delay: 0.4s; } 
        .delay-3 { animation-delay: 0.6s; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Animasi -->
    <div class="bg-animated"></div>

    <div class="glass-panel p-8 rounded-3xl w-full max-w-3xl relative fade-in-up">
        
        <!-- Success Modal (Hidden by default) -->
        <div id="successModal" class="hidden absolute inset-0 z-20 glass-panel rounded-3xl flex flex-col items-center justify-center text-center p-8 transition-opacity duration-500">
            <svg class="w-28 h-28 text-cyan-400 mb-6 floating" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-4xl font-orbitron font-bold text-white mb-3 tracking-wider">SISTEM AKTIF</h2>
            <p class="text-slate-300 text-lg">Konfigurasi berhasil ditanamkan ke dalam inti memori.</p>
            <div class="mt-6 px-6 py-3 bg-cyan-900/30 border border-cyan-500/50 rounded-lg text-cyan-300 font-medium">
                S.A.S.T.R.O sedang berjalan. Silakan kembali ke CMD.
            </div>
        </div>

        <!-- Header -->
        <div class="text-center mb-8 fade-in-up delay-1">
            <div class="flex justify-center mb-4">
                <svg class="w-16 h-16 text-cyan-400 floating" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <h1 class="text-4xl font-orbitron font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2 tracking-wide">SYSTEM SETUP</h1>
            <p class="text-slate-400 font-light text-sm">Automated Signal & Tech Remote Operator</p>
        </div>

        <form id="setupForm" class="space-y-8">
            
            <!-- Identitas Section -->
            <div class="fade-in-up delay-2 bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
                <h2 class="text-lg font-orbitron text-cyan-300 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Identitas Entitas
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Nama Asisten (Bot)</label>
                        <input type="text" id="assistantName" value="S.A.S.T.R.O" required class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Kepanjangan (Opsional)</label>
                        <input type="text" id="assistantAcronym" value="System Automated Signal & Tech Remote Operator" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Nama Pemilik (Owner)</label>
                        <input type="text" id="ownerName" required class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400" placeholder="Contoh: Sastro Negoro">
                    </div>
                </div>
            </div>

            <!-- Jaringan & AI Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in-up delay-3">
                
                <!-- Telegram -->
                <div class="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
                    <h2 class="text-lg font-orbitron text-cyan-300 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        Sinyal Telegram
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Bot Token API</label>
                            <input type="text" id="botToken" required class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400" placeholder="123456:ABC-DEF...">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Admin ID (Angka)</label>
                            <input type="number" id="adminId" required class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400" placeholder="8528645549">
                        </div>
                    </div>
                </div>

                <!-- AI -->
                <div class="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
                    <h2 class="text-lg font-orbitron text-cyan-300 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        Modul Kecerdasan
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">AI Engine</label>
                            <select id="provider" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400">
                                <option value="gemini">Google Gemini (Optimal)</option>
                                <option value="groq">Groq Llama</option>
                                <option value="openai">OpenAI GPT</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Secret API Key</label>
                            <input type="password" id="apiKey" required class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-cyan-400" placeholder="••••••••••••••••">
                        </div>
                    </div>
                </div>
            </div>

            <div class="fade-in-up delay-3 flex justify-between items-end gap-6 pt-2">
                <div class="w-1/3">
                    <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Sistem PIN</label>
                    <input type="password" id="pin" required maxlength="6" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl px-4 py-3 text-center text-white focus:outline-none focus:border-cyan-400 tracking-[0.5em] font-orbitron" placeholder="170808">
                </div>
                <button type="submit" class="w-2/3 btn-glow bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-orbitron font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    INISIALISASI SISTEM
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.querySelector('button[type="submit"]');
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> MENGHUBUNGKAN...`;
            
            const data = {
                assistantName: document.getElementById('assistantName').value,
                assistantAcronym: document.getElementById('assistantAcronym').value,
                ownerName: document.getElementById('ownerName').value,
                botToken: document.getElementById('botToken').value,
                adminId: document.getElementById('adminId').value,
                provider: document.getElementById('provider').value,
                apiKey: document.getElementById('apiKey').value,
                pin: document.getElementById('pin').value
            };

            fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if(response.ok) {
                    setTimeout(() => {
                        document.getElementById('successModal').classList.remove('hidden');
                        document.getElementById('successModal').classList.add('flex');
                    }, 500);
                } else {
                    throw new Error("Gagal menyimpan data");
                }
            })
            .catch(error => {
                btn.innerHTML = 'GAGAL! COBA LAGI';
                btn.classList.replace('from-cyan-600', 'from-red-600');
                btn.classList.replace('to-blue-600', 'to-red-800');
            });
        });
    </script>
</body>
</html>
